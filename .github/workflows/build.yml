name: Build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win32_msvc2019

      - name: Install Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath C:\npcap-sdk
          echo "NPCAP_SDK_DIR=C:\npcap-sdk" >> $env:GITHUB_ENV

      - name: Install OpenSSL and zlib via vcpkg
        shell: pwsh
        run: |
          vcpkg install openssl:x86-windows zlib:x86-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows"
          echo "DEPS_DIR=$root" >> $env:GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A Win32 \
            -DQT5_DIR="${{ env.Qt5_DIR }}" \
            -DNPCAP_SDK_DIR="${{ env.NPCAP_SDK_DIR }}" \
            -DOPENSSL_DIR="${{ env.DEPS_DIR }}" \
            -DVCPKG_LIB_DIR="${{ env.DEPS_DIR }}" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        shell: bash
        run: cd build && ctest -C Release --output-on-failure

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup -y --no-progress

      - name: Stage files for installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          mkdir staging
          $rel = "build\Release"
          # App
          cp "$rel\JsNetwork.exe" staging\
          # Qt DLLs
          foreach ($dll in (Get-ChildItem "$rel\Qt5*.dll")) { cp $dll.FullName staging\ }
          # Qt platform plugin
          mkdir staging\platforms
          cp "$rel\platforms\qwindows.dll" staging\platforms\
          # LSP
          cp "$rel\jsnetwork_lsp.dll" staging\
          cp "$rel\lsp_installer.exe" staging\
          # Npcap DLLs
          cp "$rel\wpcap.dll" staging\ -ErrorAction SilentlyContinue
          cp "$rel\Packet.dll" staging\ -ErrorAction SilentlyContinue
          # OpenSSL/zlib runtime DLLs from vcpkg bin directory
          foreach ($dll in (Get-ChildItem "$env:DEPS_DIR\bin\libcrypto*.dll","$env:DEPS_DIR\bin\libssl*.dll","$env:DEPS_DIR\bin\zlib*.dll","$env:DEPS_DIR\bin\z*.dll" -ErrorAction SilentlyContinue)) { cp $dll.FullName staging\ }
          Write-Host "=== vcpkg bin contents ==="
          Get-ChildItem "$env:DEPS_DIR\bin" -Name
          # Resources
          cp -r resources staging\resources
          Write-Host "=== Staging contents ==="
          Get-ChildItem staging -Recurse -Name

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/')
        run: iscc installer.iss

      - name: Upload Windows artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: JsNetwork-windows
          path: Output/JsNetwork-*.exe

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'desktop'

      - name: Install x86_64 dependencies via vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install openssl libpcap --triplet x64-osx
          echo "DEPS_DIR=/tmp/vcpkg/installed/x64-osx" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-osx \
            -DQT5_DIR="${{ env.Qt5_DIR }}" \
            -DOPENSSL_DIR="${{ env.DEPS_DIR }}" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        run: cd build && ctest --output-on-failure

      - name: Bundle Qt frameworks and dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Replace launcher script with real binary (post-build creates .bin wrapper)
          cp build/JsNetwork.app/Contents/MacOS/JsNetwork.bin build/JsNetwork.app/Contents/MacOS/JsNetwork
          chmod +x build/JsNetwork.app/Contents/MacOS/JsNetwork
          # Bundle Qt frameworks
          "${{ env.QT_ROOT_DIR }}/bin/macdeployqt" build/JsNetwork.app -verbose=1
          # Copy OpenSSL dylibs from vcpkg
          mkdir -p build/JsNetwork.app/Contents/Frameworks
          cp "$DEPS_DIR/lib/libssl.3.dylib" build/JsNetwork.app/Contents/Frameworks/ 2>/dev/null || cp "$DEPS_DIR/lib/libssl.dylib" build/JsNetwork.app/Contents/Frameworks/
          cp "$DEPS_DIR/lib/libcrypto.3.dylib" build/JsNetwork.app/Contents/Frameworks/ 2>/dev/null || cp "$DEPS_DIR/lib/libcrypto.dylib" build/JsNetwork.app/Contents/Frameworks/
          # Fix rpath for OpenSSL
          install_name_tool -change "$DEPS_DIR/lib/libssl.3.dylib" "@executable_path/../Frameworks/libssl.3.dylib" build/JsNetwork.app/Contents/MacOS/JsNetwork 2>/dev/null || true
          install_name_tool -change "$DEPS_DIR/lib/libcrypto.3.dylib" "@executable_path/../Frameworks/libcrypto.3.dylib" build/JsNetwork.app/Contents/MacOS/JsNetwork 2>/dev/null || true
          install_name_tool -change "$DEPS_DIR/lib/libssl.dylib" "@executable_path/../Frameworks/libssl.dylib" build/JsNetwork.app/Contents/MacOS/JsNetwork 2>/dev/null || true
          install_name_tool -change "$DEPS_DIR/lib/libcrypto.dylib" "@executable_path/../Frameworks/libcrypto.dylib" build/JsNetwork.app/Contents/MacOS/JsNetwork 2>/dev/null || true
          # Ad-hoc code sign
          codesign --force --deep --sign - build/JsNetwork.app

      - name: Package macOS artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          hdiutil create -volname JsNetwork -srcfolder JsNetwork.app -ov -format UDZO JsNetwork-macOS.dmg
          mv JsNetwork-macOS.dmg ../JsNetwork-macOS.dmg

      - name: Upload macOS artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: JsNetwork-macOS
          path: JsNetwork-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: JsNetwork-windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: JsNetwork-macOS

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            JsNetwork-*.exe
            JsNetwork-macOS.dmg
