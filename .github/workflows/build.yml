name: Build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win32_msvc2019

      - name: Install OpenSSL and zlib via vcpkg
        shell: pwsh
        run: |
          vcpkg install openssl:x86-windows zlib:x86-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows"
          echo "DEPS_DIR=$root" >> $env:GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A Win32 \
            -DQT5_DIR="${{ env.Qt5_DIR }}" \
            -DOPENSSL_DIR="${{ env.DEPS_DIR }}" \
            -DVCPKG_LIB_DIR="${{ env.DEPS_DIR }}" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Build WFP Driver (if WDK available)
        shell: pwsh
        run: |
          # Check if WDK is installed
          $wdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          if (Test-Path $wdkPath) {
            Write-Host "WDK found, building driver..."
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" driver\jsnetwork_wfp.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$PWD\" 2>&1
            if (Test-Path "driver\x64\Release\jsnetwork_wfp.sys") {
              Write-Host "Driver built successfully"
            } else {
              Write-Host "Driver build failed (non-fatal, driver is optional)"
            }
          } else {
            Write-Host "WDK not found, skipping driver build"
          }
        continue-on-error: true

      - name: Run Tests
        shell: bash
        run: cd build && ctest -C Release --output-on-failure

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup -y --no-progress

      - name: Stage files for installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          mkdir staging
          $rel = "build\Release"
          # App
          cp "$rel\JsNetwork.exe" staging\
          # Qt DLLs
          foreach ($dll in (Get-ChildItem "$rel\Qt5*.dll")) { cp $dll.FullName staging\ }
          # Qt platform plugin
          mkdir staging\platforms
          cp "$rel\platforms\qwindows.dll" staging\platforms\
          # Qt SQL plugins (SQLite driver for traffic storage)
          mkdir staging\sqldrivers -ErrorAction SilentlyContinue
          cp "$rel\sqldrivers\qsqlite.dll" staging\sqldrivers\ -ErrorAction SilentlyContinue
          # WinDivert DLL and drivers
          cp "$rel\WinDivert.dll" staging\ -ErrorAction SilentlyContinue
          cp "$rel\WinDivert64.sys" staging\ -ErrorAction SilentlyContinue
          cp "$rel\WinDivert32.sys" staging\ -ErrorAction SilentlyContinue
          # WFP Callout Driver (if built)
          if (Test-Path "driver\x64\Release\jsnetwork_wfp.sys") {
            cp "driver\x64\Release\jsnetwork_wfp.sys" staging\
            Write-Host "WFP driver staged"
          }
          # OpenSSL/zlib runtime DLLs from vcpkg bin directory
          foreach ($dll in (Get-ChildItem "$env:DEPS_DIR\bin\libcrypto*.dll","$env:DEPS_DIR\bin\libssl*.dll","$env:DEPS_DIR\bin\zlib*.dll" -ErrorAction SilentlyContinue)) { cp $dll.FullName staging\ }
          Write-Host "=== vcpkg bin contents ==="
          Get-ChildItem "$env:DEPS_DIR\bin" -Name
          # Resources
          cp -r resources staging\resources
          Write-Host "=== Staging contents ==="
          Get-ChildItem staging -Recurse -Name

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/')
        run: iscc installer.iss

      - name: Upload Windows artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: JsNetwork-windows
          path: Output/JsNetwork-*.exe

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'desktop'

      - name: Install x86_64 dependencies via vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          /tmp/vcpkg/vcpkg install openssl libpcap --triplet x64-osx-dynamic
          echo "DEPS_DIR=/tmp/vcpkg/installed/x64-osx-dynamic" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-osx-dynamic \
            -DQT5_DIR="${{ env.Qt5_DIR }}" \
            -DOPENSSL_DIR="${{ env.DEPS_DIR }}" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        run: cd build && ctest --output-on-failure

      - name: Bundle Qt frameworks and dependencies
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set +e
          APP=build/JsNetwork.app
          # Replace launcher script with real binary
          cp "$APP/Contents/MacOS/JsNetwork.bin" "$APP/Contents/MacOS/JsNetwork"
          chmod +x "$APP/Contents/MacOS/JsNetwork"
          # Bundle Qt frameworks (macdeployqt copies all plugins by default)
          "${{ env.QT_ROOT_DIR }}/bin/macdeployqt" "$APP" -verbose=1
          echo "macdeployqt exit code: $?"
          # Remove unnecessary Qt plugins (only keep platforms and sqldrivers)
          for dir in imageformats iconengines styles printsupport bearer; do
            rm -rf "$APP/Contents/PlugIns/$dir"
          done
          # Strip Qt framework Headers and .prl files (not needed at runtime)
          find "$APP/Contents/Frameworks" -name "Headers" -type d -exec rm -rf {} + 2>/dev/null
          find "$APP/Contents/Frameworks" -name "*.prl" -delete 2>/dev/null
          # Copy OpenSSL dylibs (find .dylib files, skip .a static archives)
          mkdir -p "$APP/Contents/Frameworks"
          for lib in ssl crypto; do
            DYLIB=$(find "$DEPS_DIR/lib" -name "lib${lib}*.dylib" | head -1)
            if [ -n "$DYLIB" ]; then
              cp "$DYLIB" "$APP/Contents/Frameworks/"
              INSTALL_NAME=$(otool -D "$DYLIB" | tail -1)
              BASENAME=$(basename "$DYLIB")
              install_name_tool -change "$INSTALL_NAME" "@executable_path/../Frameworks/$BASENAME" "$APP/Contents/MacOS/JsNetwork"
              echo "Bundled $BASENAME (install_name: $INSTALL_NAME)"
            else
              echo "WARNING: lib${lib}*.dylib not found in $DEPS_DIR/lib"
            fi
          done
          # Ad-hoc code sign
          codesign --force --deep --sign - "$APP"
          echo "codesign exit code: $?"

      - name: Package macOS artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p build/_dmg
          cp -R build/JsNetwork.app build/_dmg/
          ln -s /Applications build/_dmg/Applications
          hdiutil create -volname JsNetwork -srcfolder build/_dmg -ov -format UDZO build/JsNetwork-macOS.dmg
          mv build/JsNetwork-macOS.dmg JsNetwork-macOS.dmg

      - name: Upload macOS artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: JsNetwork-macOS
          path: JsNetwork-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: JsNetwork-windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: JsNetwork-macOS

      - name: Clean up existing releases for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          for id in $(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" 2>/dev/null); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" 2>/dev/null || true
          done

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            JsNetwork-*.exe
            JsNetwork-macOS.dmg
