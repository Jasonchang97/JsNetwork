name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win32_msvc2019

      - name: Install Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath C:\npcap-sdk
          echo "NPCAP_SDK_DIR=C:\npcap-sdk" >> $env:GITHUB_ENV

      - name: Install OpenSSL and zlib via vcpkg
        shell: pwsh
        run: |
          vcpkg install openssl:x86-windows zlib:x86-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows"
          echo "DEPS_DIR=$root" >> $env:GITHUB_ENV
          Write-Host "=== lib contents ==="
          Get-ChildItem "$root\lib" -Name
          Write-Host "=== zlib headers ==="
          Test-Path "$root\include\zlib.h"

      - name: Configure
        shell: bash
        run: |
          VCPKG_ROOT=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")
          cmake -B build -G "Visual Studio 17 2022" -A Win32 \
            -DQT5_DIR="${{ env.Qt5_DIR }}" \
            -DNPCAP_SDK_DIR="${{ env.NPCAP_SDK_DIR }}" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x86-windows \
            -DOPENSSL_DIR="${{ env.DEPS_DIR }}" \
            -DVCPKG_LIB_DIR="${{ env.DEPS_DIR }}" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        shell: bash
        run: cd build && ctest -C Release --output-on-failure

  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'desktop'

      - name: Install dependencies
        run: |
          brew install openssl@1.1 libpcap

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DQT5_DIR="${{ env.Qt5_DIR }}" \
            -DOPENSSL_DIR="$(brew --prefix openssl@1.1)" \
            -DPCAP_DIR="$(brew --prefix libpcap)" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        run: cd build && ctest --output-on-failure
